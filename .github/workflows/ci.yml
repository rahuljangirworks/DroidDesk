name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Profile contracts
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Run repository checks
        run: scripts/check.sh

  android:
    name: Flutter and Android
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.13"

      - name: Install Flutter dependencies
        working-directory: app
        run: flutter pub get

      - name: Check Dart formatting
        working-directory: app
        run: dart format --output=none --set-exit-if-changed lib test test_ffi.dart

      - name: Analyze Flutter
        working-directory: app
        run: flutter analyze --fatal-infos

      - name: Test Flutter
        working-directory: app
        run: flutter test

      - name: Generate Android Gradle wrapper
        run: |
          printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > app/android/local.properties
          gradle -p app/android wrapper --gradle-version 8.13

      - name: Test Kotlin profile
        working-directory: app/android
        run: ./gradlew :app:testDebugUnitTest

      - name: Build debug APK
        working-directory: app
        run: flutter build apk --debug

      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: droiddesk-debug
          path: app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
